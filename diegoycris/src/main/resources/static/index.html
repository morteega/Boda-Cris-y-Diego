<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Diego y Cris - Nuestra Boda</title>
        <style>
            body, html { height: 100%; margin: 0; font-family: system-ui, Arial, sans-serif;  }
           
            .hero {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;

                background-image:
                    linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
                    url('/img/image.jpg');
                background-size: cover;
                background-position: center;
                color:white;
                padding:24px;  
            }
            h1 {
                font-size: clamp(2rem, 5vw, 3.5rem);
                margin: 0 0 10px 0;
            }
             p {
                font-size: clamp(1rem, 2.5vw, 1.25rem);
                margin: 0;
                opacity: 0.95;
            }
            .card {
                background: rgba(0,0,0,0.25);
                padding: 24px 28px;
                border-radius: 18px;
                backdrop-filter: blur(6px);
                max-width: 720px;
            }
            </style>
            <body>
                <div class="hero">
                  <div class="card">
                    <h1>Bienvenidos a la boda de Diego y Cristina 💍</h1>
                    <p>¡Nos hace mucha ilusión compartir este día con vosotros!</p>
              </div>
            </div>
        </body>
        
    </head>
</html>
</html>
